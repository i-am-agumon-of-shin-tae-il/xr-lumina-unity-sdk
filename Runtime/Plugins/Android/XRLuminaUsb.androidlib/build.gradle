apply plugin: 'com.android.library'

android {
    namespace 'com.ninefive.xrlumina.usb'
    compileSdkVersion getProperty('unity.compileSdkVersion') as int
    buildToolsVersion getProperty('unity.buildToolsVersion')
    defaultConfig {
        minSdkVersion getProperty('unity.minSdkVersion') as int
        consumerProguardFiles 'proguard-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
